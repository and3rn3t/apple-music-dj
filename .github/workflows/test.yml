name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff
        run: ruff check scripts tests .github/scripts

      - name: ShellCheck
        run: shellcheck scripts/*.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.14", "3.15"]
        include:
          # SKILL.md declares darwin support: run the real scripts on BSD tools too.
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # macOS ships bash 3.2; the runner image puts Homebrew's bash 5 first on PATH.
      # The integration tests run plain `bash`, so shim the system one in front.
      - name: Use the system bash (3.2) on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
          /bin/bash --version | head -1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pyyaml

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=80 \
            -v

      - name: Check README coverage badge
        if: matrix.python-version == '3.14' && runner.os == 'Linux'
        run: python .github/scripts/release_checks.py check-coverage-badge coverage.json
