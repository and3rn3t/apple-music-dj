<text x="462" y="23" text-anchor="middle" class="cap" xml:space="preserve">🎧 Apple Music DJ</text>
<text class="l req s1l0" x="24" y="64" xml:space="preserve">› Show me my taste card</text>
<text class="l dim s1l1" x="24" y="84" xml:space="preserve">╔══════════════════════════════════════╗</text>
<text class="l out s1l2" x="24" y="104" xml:space="preserve">║          🎧  TASTE DNA CARD          ║</text>
<text class="l dim s1l3" x="24" y="124" xml:space="preserve">╠══════════════════════════════════════╣</text>
<text class="l out s1l4" x="24" y="144" xml:space="preserve">  Archetype: Nostalgia Keeper</text>
<text class="l out s1l5" x="24" y="164" xml:space="preserve">  Your heart lives in a different decade. The classics never get old.</text>
<text class="l dim s1l6" x="24" y="184" xml:space="preserve"></text>
<text class="l dim s1l7" x="24" y="204" xml:space="preserve">  ── TOP GENRES ──</text>
<text class="l out s1l8" x="24" y="224" xml:space="preserve">  Alternative......... ███████████████░░░░░ 75%</text>
<text class="l out s1l9" x="24" y="244" xml:space="preserve">  Rock................ ██░░░░░░░░░░░░░░░░░░ 12%</text>
<text class="l out s1l10" x="24" y="264" xml:space="preserve">  Electronic.......... ██░░░░░░░░░░░░░░░░░░ 12%</text>
<text class="l dim s1l11" x="24" y="284" xml:space="preserve"></text>
<text class="l dim s1l12" x="24" y="304" xml:space="preserve">  ── TOP ARTISTS ──</text>
<text class="l out s1l13" x="24" y="324" xml:space="preserve">   1. Radiohead</text>
<text class="l out s1l14" x="24" y="344" xml:space="preserve">   2. Oasis</text>
<text class="l out s1l15" x="24" y="364" xml:space="preserve">   3. Muse</text>
<text class="l out s1l16" x="24" y="384" xml:space="preserve">  …</text>
<text class="l req s2l0 still" x="24" y="64" xml:space="preserve">› Songs like Radiohead</text>
<text class="l out s2l1 still" x="24" y="84" xml:space="preserve">Like Radiohead · Oct 2026</text>
<text class="l out s2l2 still" x="24" y="104" xml:space="preserve"> 1. Starlight — Muse                 Fans of Radiohead tend to love Muse.</text>
<text class="l out s2l3 still" x="24" y="124" xml:space="preserve"> 2. Champagne Supernova — Oasis      Fans of Radiohead tend to love Oasis.</text>
<text class="l out s2l4 still" x="24" y="144" xml:space="preserve"> 3. Paranoid Android — Radiohead     One of Radiohead&#x27;s best.</text>
<text class="l out s2l5 still" x="24" y="164" xml:space="preserve"> 4. Wonderwall — Oasis               Fans of Radiohead tend to love Oasis.</text>
<text class="l out s2l6 still" x="24" y="184" xml:space="preserve"> 5. Supermassive Black Hole — Muse   Fans of Radiohead tend to love Muse.</text>
<text class="l req s3l0" x="24" y="64" xml:space="preserve">› Make me a 90s throwback</text>
<text class="l out s3l1" x="24" y="84" xml:space="preserve">1990s Throwback · Oct 2026</text>
<text class="l out s3l2" x="24" y="104" xml:space="preserve"> 1. Let Down — Radiohead               Radiohead in the 1990s — from OK Computer.</text>
<text class="l out s3l3" x="24" y="124" xml:space="preserve"> 2. Wonderwall — Oasis                 Oasis in the 1990s — from (What&#x27;s the Story) Morning Glory?.</text>
<text class="l out s3l4" x="24" y="144" xml:space="preserve"> 3. Bachelorette — Björk               A 1990s track that fits your taste.</text>
<text class="l out s3l5" x="24" y="164" xml:space="preserve"> 4. Don&#x27;t Look Back in Anger — Oasis   Oasis in the 1990s — from (What&#x27;s the Story) Morning Glory?.</text>
<text class="l out s3l6" x="24" y="184" xml:space="preserve"> 5. Paranoid Android — Radiohead       Radiohead in the 1990s — from OK Computer.</text>
<text class="l req s4l0" x="24" y="64" xml:space="preserve">› Give me one song for today</text>
<text class="l out s4l1" x="24" y="84" xml:space="preserve">🎧 Today&#x27;s pick: *Everything In Its Right Place* by Radiohead — A deep cut from Radiohead you haven&#x27;t heard yet.</text>
<text class="l req s5l0" x="24" y="64" xml:space="preserve">› How compatible am I with Björk?</text>
<text class="l out s5l1" x="24" y="84" xml:space="preserve">Björk: 12% — Wild card — musically distant from your usual taste.</text>
<text x="24" y="446" class="cap" xml:space="preserve">demo mode · fictional listener · nothing touches an Apple Music account</text>
</svg>
