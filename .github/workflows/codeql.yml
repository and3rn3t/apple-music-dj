# Calls the shared reusable CodeQL workflow (and3rn3t/.github).
# Set `languages` to your project's languages: javascript, typescript, python, swift, etc.
name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:  # lets us re-run by hand (and wake it after GitHub's 60-day inactivity auto-disable)

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: and3rn3t/.github/.github/workflows/reusable-codeql.yml@0415d76d5dfdf1dec81d4756d411850057f38618 # v1
    with:
      languages: '["python"]'
