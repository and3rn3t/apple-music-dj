# GitHub Labels
# Synced automatically by the label-sync workflow.
# Edit this file and push to main to update labels in the repo.

# ---- Types ----

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: feature
  color: "0e8a16"
  description: New feature request

- name: enhancement
  color: "a2eeef"
  description: Improvement to existing functionality

- name: documentation
  color: "0075ca"
  description: Documentation additions or updates

- name: question
  color: "d876e3"
  description: Further information is requested

- name: refactor
  color: "c5def5"
  description: Code restructuring with no behavior change

- name: security
  color: "e11d48"
  description: Security-related issue or improvement

- name: performance
  color: "f9d0c4"
  description: Performance improvement or issue

- name: dependencies
  color: "0366d6"
  description: Dependency updates

- name: chore
  color: "fef2c0"
  description: Maintenance with no user-facing change (release drafter's Maintenance section)

- name: ci
  color: "ededed"
  description: GitHub Actions workflows and repo automation

- name: tests
  color: "c2e0c6"
  description: Test suite only

- name: breaking
  color: "b60205"
  description: Breaking change; the release drafter makes the next version a major one

# ---- Status ----

- name: needs-triage
  color: "fbca04"
  description: Awaiting initial review and categorization

- name: in-progress
  color: "1d76db"
  description: Actively being worked on

- name: blocked
  color: "b60205"
  description: Blocked by another issue or external factor

- name: wontfix
  color: "e4e669"
  description: This will not be worked on

- name: duplicate
  color: "cfd3d7"
  description: This issue or PR already exists

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: needs-account
  color: "e99695"
  description: Needs a real Apple Music account (and tokens) to do or verify

# ---- Priority ----

- name: "priority: critical"
  color: "b60205"
  description: Must be fixed immediately

- name: "priority: high"
  color: "d93f0b"
  description: Should be addressed soon

- name: "priority: medium"
  color: "fbca04"
  description: Normal priority

- name: "priority: low"
  color: "0e8a16"
  description: Nice to have, no rush

# ---- Size (estimated effort) ----

- name: "size: xs"
  color: "ededed"
  description: "Trivial change (< 30 min)"

- name: "size: s"
  color: "d4c5f9"
  description: "Small change (a few hours)"

- name: "size: m"
  color: "bfd4f2"
  description: "Medium change (a day or two)"

- name: "size: l"
  color: "c2e0c6"
  description: "Large change (several days)"

- name: "size: xl"
  color: "f9d0c4"
  description: "Very large change (a week+)"

# ---- Risk (applied by hand) ----

- name: account-writes
  color: "b60205"
  description: Touches code that writes to a user's Apple Music account; every write must stay confirmed (--yes)

- name: clawhub
  color: "5319e7"
  description: Changes what ClawHub's reviewer sees (SKILL.md, clawhub.json, shipped files, trust claims)

# ---- Area (applied to PRs by .github/labeler.yml) ----

- name: "area: api"
  color: "bfdadc"
  description: apple_music_api.sh and the call_api layer

- name: "area: strategies"
  color: "bfdadc"
  description: Playlist strategies, building, health, history and feedback

- name: "area: insights"
  color: "bfdadc"
  description: Taste profile, cards, drift, compatibility, share codes, insights, catalog gaps

- name: "area: auth"
  color: "bfdadc"
  description: Token setup, signing and verification

- name: "area: demo"
  color: "bfdadc"
  description: Demo mode and the mock Apple Music API

- name: "area: automation"
  color: "bfdadc"
  description: Cron jobs, daily pick, new releases, concert prep

- name: "area: import"
  color: "bfdadc"
  description: Spotify and playlist import
